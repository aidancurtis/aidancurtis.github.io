<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tells the browser the site has light and dark themes, so it never flashes white between pages -->
    <meta name="color-scheme" content="light dark" />
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta
      name="description"
      content="{{ page.description | default: site.description | strip_newlines | escape }}"
    />
    <link rel="icon" href="{{ '/assets/favicon.ico' | relative_url }}" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}" />
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon-32.png' | relative_url }}" />
    <link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}" />
    <!-- Link previews (X, LinkedIn, iMessage, etc.) -->
    <meta property="og:title" content="{{ page.title | default: site.title | escape }}" />
    <meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | escape }}" />
    <meta property="og:url" content="{{ page.url | absolute_url }}" />
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}" />
    <meta property="og:image" content="{{ '/imgs/portrait.jpg' | absolute_url }}" />
    <meta name="twitter:card" content="summary" />
    <!-- Self-hosted fonts, fetched before anything is drawn so text never swaps fonts -->
    <link rel="preload" href="{{ '/assets/fonts/eb-garamond.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="{{ '/assets/fonts/cormorant-garamond.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}" />
    {% if page.math %}
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"
    ></script>
    {% endif %}
  </head>

  <body>
    <div class="content">
      <header class="site-header">
        <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <nav class="site-nav" aria-label="Main">
          <a href="{{ '/' | relative_url }}"{% if page.url == "/" or page.url == "/index.html" %} class="active" aria-current="page"{% endif %}>About</a>
          <a href="{{ '/research/' | relative_url }}"{% if page.url contains "/research/" %} class="active" aria-current="page"{% endif %}>Research</a>
          <a href="{{ '/thoughts/' | relative_url }}"{% if page.url contains "/thoughts/" %} class="active" aria-current="page"{% endif %}>Thoughts</a>
          <a href="{{ '/books/' | relative_url }}"{% if page.url contains "/books/" %} class="active" aria-current="page"{% endif %}>Books</a>
          <a href="{{ '/docs/aidan_curtis_resume.pdf' | relative_url }}" target="_blank" rel="noopener noreferrer">CV</a>
        </nav>
      </header>

      <main>{{ content }}</main>
    </div>
  </body>
</html>
